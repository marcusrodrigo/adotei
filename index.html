<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet | Design & Adoção</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <h1>🐾 Adota<span>Pet</span></h1>
    </div>
    <nav>
        <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a href="#adotar-ancora">Adotar</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#">Cadastrar</a></li>
            <li><button id="btn-dark-toggle">🌙 Dark Mode</button></li>
        </ul>
    </nav>
</header>

<section class="hero" id="inicio">
    <div class="hero-container-images">
        <img src="https://png.pngtree.com/png-vector/20231201/ourmid/pngtree-happy-funny-cute-kitty-fluffy-cat-png-image_10793617.png" class="float-img p1" alt="Pet 1">
        <img src="https://png.pngtree.com/png-vector/20201128/ourmid/pngtree-an-adult-tabby-cat-png-image_2480453.jpg" class="float-img p2" alt="Pet 2">
        <img src="https://png.pngtree.com/png-vector/20231019/ourmid/pngtree-funny-black-cat-png-image_10213159.png" class="float-img p3" alt="Pet 3">
        
        <h2>Amor <br>Não Se <br>Compra.</h2>
        
        <img src="https://static.designi.com.br/preview/10255850/265/7f9e7648d6dc0a39.jpg" class="float-img p4" alt="Pet 4">
        <img src="https://img.freepik.com/fotos-gratis/lindo-retrato-de-cachorro_23-2149218452.jpg" class="float-img p5" alt="Pet 5">
        <img src="https://e7.pngegg.com/pngimages/931/480/png-clipart-puppy-dog-breed-golden-retriever-beagle-golden-retriever-animals-pet.png" class="float-img p6" alt="Pet 6">
    </div>
    <p>Conectando patas ansiosas a corações abertos através de uma plataforma moderna, minimalista e direta.</p>
</section>

<main class="container">
    <aside class="sidebar">
        <div class="sidebar-content">
            <h3>Cadastrar Pet</h3>
            <form id="meuFormulario">
                <label for="nome">Nome do Animal</label>
                <input type="text" id="nome" placeholder="Ex: Tobias" required>
                
                <label for="categoria">Espécie</label>
                <select id="categoria" required>
                    <option value="Cão">Cão</option>
                    <option value="Gato">Gato</option>
                </select>

                <label for="foto-upload">Foto (JPG/PNG até 15MB)</label>
                <input type="file" id="foto-upload" accept=".jpg, .jpeg, .png" required>

                <label for="custom-msg">Mensagem Personalizada (Opcional)</label>
                <textarea id="custom-msg" rows="3" placeholder="Se deixar vazio, usaremos a mensagem padrão de adoção..."></textarea>

                <button type="submit" class="btn-primary">Salvar no Sistema</button>
            </form>

            <hr>

            <h3 id="adotar-ancora">Filtrar Galeria</h3>
            <form id="formBusca" onsubmit="event.preventDefault();">
                <label for="inputBusca">Pesquisar Nome</label>
                <input type="search" id="inputBusca" placeholder="Ex: Rex, Mimi...">

                <label for="filtroEspecie">Espécie</label>
                <select id="filtroEspecie">
                    <option value="Todos">Todos</option>
                    <option value="Cão">Cão</option>
                    <option value="Gato">Gato</option>
                </select>
                
                <button type="button" class="btn-secondary" onclick="resetarFiltros()">Limpar Filtros</button>
            </form>
        </div>
    </aside>

    <section class="animal-grid" id="listaItens">
        </section>
</main>

<div id="modal-pet">
    <div class="modal-body">
        <div id="modal-conteudo"></div>
        <button onclick="document.getElementById('modal-pet').style.display='none'" class="btn-primary">Fechar Detalhes</button>
    </div>
</div>

<script src="db.js"></script>
<script src="controller.js"></script>

</body>
</html>
