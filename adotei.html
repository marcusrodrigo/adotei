<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Responsivo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo">
        <h1>🐾 AdotaPet</h1>
    </div>
    <nav>
        <ul>
            <li><a href="#">Início</a></li>
            <li><a href="#">Adotar</a></li>
            <li><a href="#">Login</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <aside class="sidebar">
        <h3>Filtrar Busca</h3>
        <form>
            <label for="busca">Palavra-chave</label>
            <input type="search" id="busca" placeholder="Ex: Husky, dócil...">
            
            <label for="especie">Espécie</label>
            <select id="especie">
                <option value="">Todas</option>
                <option value="cao">Cão</option>
                <option value="gato">Gato</option>
            </select>

            <button type="submit" class="btn-primary">Aplicar Filtros</button>
        </form>
    </aside>

    <section class="animal-grid">
        <article class="animal-card">
            <div class="badge">Novo</div>
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=300&q=80" alt="Foto do animal">
            <div class="card-content">
                <h3>Rex (Cão)</h3>
                <p>Porte: Médio | Idade: 2 anos</p>
                <p>📍 São Paulo - SP</p>
                <a href="#" class="btn-secondary">Ver Detalhes</a>
            </div>
        </article>

        <article class="animal-card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=300&q=80" alt="Foto do gato">
            <div class="card-content">
                <h3>Mimi (Gata)</h3>
                <p>Porte: Pequeno | Idade: 1 ano</p>
                <p>📍 Rio de Janeiro - RJ</p>
                <a href="#" class="btn-secondary">Ver Detalhes</a>
            </div>
        </article>
    </section>
</main>

</body>
</html>
